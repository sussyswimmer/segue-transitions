<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Segue panel (screenshot harness)</title>
    <link rel="stylesheet" href="../sidepanel.css" />
  </head>
  <body>
    <script>
      // Load the real panel markup, then boot it against the stub chrome.* surface.
      fetch('../sidepanel.html')
        .then((r) => r.text())
        .then((html) => {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          document.body.innerHTML = doc.body.innerHTML;
          // The panel's own paths are relative to the repo root, not this folder.
          document.querySelectorAll('img[src^="icons/"]').forEach((img) => {
            img.src = '../' + img.getAttribute('src');
          });
          const shim = document.createElement('script');
          shim.src = 'preview-shim.js';
          shim.onload = () => {
            const panel = document.createElement('script');
            panel.type = 'module';
            panel.src = '../sidepanel.js';
            document.body.append(panel);
          };
          document.body.append(shim);
        });
    </script>
  </body>
</html>
